name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance + trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1 (Node 24 ships 11.x; pin latest to be safe).
      - run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION != package.json $PKG_VERSION"
            exit 1
          fi

      - run: npm install

      - run: npm run build

      - name: Publish
        # npm Trusted Publishing (OIDC): the package's trusted publisher is
        # codai-ro/codai-sdk + publish.yml (configured 2026-09-24 via
        # `npm trust github codai-sdk`). No NPM_TOKEN; provenance is implied.
        run: npm publish --access public
